<div class="paper">
  <p class="title"><b>{{ include.paper.title }}</b></p>
  <p>{{ include.paper.authors }}</p>
  <p><i>{{ include.paper.venue }}</i></p>
  <div class="paper-buttons">
    {% if include.paper.paper_pdf %}
      <a class="button" href="{{ include.paper.paper_pdf }}" target="_blank">Paper</a>
    {% endif %}
    {% if include.paper.project_page %}
      <a class="button" href="{{ include.paper.project_page }}" target="_blank">Project</a>
    {% endif %}
    {% if include.paper.video %}
      <a class="button" href="{{ include.paper.video }}" target="_blank">Video</a>
    {% endif %}
    {% if include.paper.code %}
      <a class="button" href="{{ include.paper.code }}" target="_blank">Code</a>
    {% endif %}
  </div>
</div>
